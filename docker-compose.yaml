
services:
  db:
    image: postgres:16
    container_name: brewlite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: brewlite
      POSTGRES_PASSWORD: CONGNGHEPHANMEM12345
      POSTGRES_DB: brewlite
    ports:
      - "5433:5432"
    volumes:
      - brewlite_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewlite -d brewlite"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  brewlite_pgdata: